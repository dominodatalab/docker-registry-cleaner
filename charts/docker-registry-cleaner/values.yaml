# Public URL of the Domino deployment — used for clickable links in reports and
# to derive the ingress hostname.  Set to the external URL of your deployment,
# e.g. https://domino.example.com
dominoUrl: "https://domino.example.com"

# Kubernetes namespace where Domino platform services run (mongodb, keycloak, …)
dominoPlatformNamespace: domino-platform

# ── Backend container configuration ──────────────────
image:
  repository: quay.io/domino/docker-registry-cleaner
  tag: v0.5.0
  pullPolicy: Always

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# Set to "json" to enable structured JSON logging (one JSON object per line).
# Useful for log aggregators such as Datadog or ELK that ingest pod logs.
# Leave empty for the default human-readable format.
logFormat: ""

# Maximum wall-clock seconds a background job is allowed to run before the API
# server kills it with SIGKILL. A hung subprocess would otherwise hold its slot
# indefinitely until the pod is restarted. Default: 3600 (1 hour).
jobTimeoutSeconds: 3600

# Optional env overrides for external registries (ECR, Quay, GCR, ACR, etc.)
# Registry URL is set via config.registry.url above.
env:
  registryAuthSecret: ""  # Name of a K8s secret with .dockerconfigjson for secure credential storage
  azureClientId: ""       # Client ID of the managed identity for ACR auth
  azureTenantId: ""       # Azure AD tenant ID for ACR auth

# Additional environment variables injected into the main container.
# Supports the full Kubernetes env entry syntax, including valueFrom.
extraEnv: []
# - name: AWS_DEFAULT_REGION
#   value: us-west-2
# - name: MY_SECRET
#   valueFrom:
#     secretKeyRef:
#       name: my-secret
#       key: value

# ── Frontend container configuration ──────────────────
frontend:
  enabled: true
  image:
    repository: quay.io/domino/docker-registry-cleaner-frontend
    tag: v0.5.0
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  # Subpath under the Domino hostname where the UI will be served.
  basePath: /registry-cleaner
  ingress:
    enabled: true
    className: nginx
    # Nginx rewrites /registry-cleaner/foo → /foo before forwarding to Flask.
    # FLASK_BASE_PATH (= frontend.basePath) tells Flask its SCRIPT_NAME so that
    # url_for() generates correct prefixed URLs — no configuration-snippet needed.
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /$2
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    tls: []
  networkPolicy:
    enabled: true
    # Label on the namespace that contains the nginx ingress controller.
    # Traffic is allowed from any pod in a namespace bearing this label.
    ingressNamespaceLabel:
      domino-platform: "true"

# ── StatefulSet pod configuration ──────────────────
imagePullSecrets:
  - name: domino-quay-repos

# fsGroup makes the PVC at /data/reports writable by nonroot (65532)
podSecurityContext:
  fsGroup: 65532

serviceAccount:
  create: true
  name: docker-registry-cleaner
  # Optional: override full name; by default uses release-name + chart name
  fullnameOverride: ""

persistence:
  enabled: true
  # Name of the pre-existing RWX PVC shared across Domino services (domino-shared-store).
  # CronJob pods can land on any node and still mount this volume.
  pvcName: "domino-shared-store"
  # Subdirectory within the shared PVC used exclusively by this service.
  subPath: "registry-cleaner"

# Backend API configuration
# The backend container exposes a REST API on port 8081 for the frontend sidecar.
# Port 8081 is also the Prometheus /metrics scrape endpoint.
# This port is NOT exposed by any Kubernetes Service — it is reachable via
# kubectl port-forward, or from a Prometheus scraper allowed by metrics.networkPolicy.
backendApi:
  port: 8081
  # Name of the Kubernetes Secret that holds the API key used to authenticate
  # frontend→backend requests. The chart creates this secret automatically with a
  # random 32-character key on first install and preserves it across upgrades and
  # reinstalls (helm.sh/resource-policy: keep). Override apiKeySecret to use a
  # pre-existing secret instead.
  apiKeySecret: "registry-cleaner-api-key"

# Prometheus metrics scraping configuration
# The backend exposes GET /metrics on port 8081 (backendApi.port).
#
# NetworkPolicy: set enabled=true so the Prometheus scraper can reach port 8081.
# - Same-namespace Prometheus (e.g. running in domino-platform): set prometheusPodLabels
#   to match the Prometheus pod labels. namespaceSelector is not used in this case.
#   Example: prometheusPodLabels: { app: prometheus }
# - Different-namespace Prometheus: set prometheusNamespaceLabel instead.
#   Example: prometheusNamespaceLabel: { kubernetes.io/metadata.name: monitoring }
# - Leave both empty to allow all pods in the same namespace to reach port 8081.
metrics:
  networkPolicy:
    enabled: true
    # Defaults match the Prometheus server pod labels on standard Domino deployments
    # (prometheus Helm chart in domino-platform namespace). Override if your cluster
    # runs Prometheus in a different namespace or with different labels.
    prometheusPodLabels:
      app.kubernetes.io/name: prometheus
      app.kubernetes.io/component: server
    # For cross-namespace Prometheus: set this instead of prometheusPodLabels.
    # e.g. prometheusNamespaceLabel: { kubernetes.io/metadata.name: monitoring }
    prometheusNamespaceLabel: {}

# ── Docker registry access ──────────────────
# Names of the Docker registry pod(s) that the cleaner's service account is
# permitted to exec into (used by the run_registry_gc operation).  The RBAC
# Role grants pods/exec only for these specific pod names, limiting blast
# radius if the service account is ever compromised.
# Default matches a single-replica StatefulSet named "docker-registry".
registry:
  execPodNames:
    - docker-registry-0

# ── Application configuration ──────────────────
config:
  # Inline config.yaml content mounted into the container
  registry:
    url: "docker-registry:5000"
    repository: "dominodatalab"
  mongo:
    host: "mongodb-replicaset"
    port: 27017
    replicaset: "rs0"
    db: "domino"
  analysis:
    max_workers: 4
    timeout: 300
    output_dir: "/data/reports"
  retry:
    max_retries: 3
    initial_delay: 1.0
    max_delay: 60.0
    exponential_base: 2.0
    jitter: true
    timeout: 300
  cache:
    enabled: true
    tag_list_ttl: 1800
    tag_list_max_size: 100
    image_inspect_ttl: 3600
    image_inspect_max_size: 1000
    mongo_query_ttl: 600
    mongo_query_max_size: 500
    layer_calc_ttl: 7200
    layer_calc_max_size: 2000
  s3:
    bucket: ""
    region: "us-west-2"
  skopeo:
    rate_limit:
      enabled: true  # Enable rate limiting for registry operations
      requests_per_second: 10.0  # Maximum requests per second (adjust based on registry capacity)
      burst_size: 20  # Allow burst of up to N requests (helps with parallel operations)
  reports:
    archived_tags: "archived-tags.json"
    deletion_analysis: "deletion-analysis.json"
    unused_environments: "unused-environments.json"
    old_revisions: "old-revisions.json"
  security:
    dry_run_by_default: true
    require_confirmation: true

# ── Scheduled CronJobs ────────────────────────────────────────────────────────
# Each entry creates a Kubernetes CronJob that shares the image, config, secrets,
# and service account of the StatefulSet.
#
# Fields:
#   name              – unique short name; becomes part of the CronJob K8s name
#   schedule          – standard 5-field cron expression (UTC)
#   command           – container command list, passed to python main.py
#   ensureFreshReports – if true, run `python main.py ensure_reports` before the
#                        command so reports are no older than 24 h (useful for
#                        deletion jobs that depend on up-to-date report data)
#   backoffLimit      – number of retries on failure (default: 1)
#   resources         – container resource requests/limits (uses chart defaults if omitted)
#
# Example:
# cronjobs:
#   - name: reports
#     schedule: "0 2 * * *"
#     command: ["python", "main.py", "reports"]
#
#   - name: delete-archived-tags
#     schedule: "0 2 * * 0"
#     ensureFreshReports: true
#     command: ["python", "main.py", "delete_archived_tags", "--environment", "--model", "--apply"]
#     resources:
#       requests: { cpu: 100m, memory: 256Mi }
#       limits:   { cpu: 1000m, memory: 1Gi }
#
#   - name: delete-unused-environments
#     schedule: "0 3 * * 0"
#     ensureFreshReports: true
#     command: ["python", "main.py", "delete_unused_environments", "--unused-since-days", "90"]
#
#   - name: delete-unused-references
#     schedule: "0 4 1 * *"
#     command: ["python", "main.py", "delete_unused_references", "--apply"]
#
#   - name: run-registry-gc
#     schedule: "0 5 * * 0"
#     command: ["python", "main.py", "run_registry_gc"]
cronjobs: []
